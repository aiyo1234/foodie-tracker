<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rate Your Meal - Foodie Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="review-body">

  <div class="review-container">
    <div class="card-form">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <h1 class="form-title">Rate Your Meal</h1>
          <p class="form-subtitle" id="visitSubtitle">Tell us about your food experience</p>
        </div>
        <a href="/" style="text-decoration: none; font-size: 24px; color: #94a3b8;">✕</a>
      </div>

      <form id="reviewForm" enctype="multipart/form-data">
        <input type="hidden" id="sessionId" name="sessionId" value="">
        <input type="hidden" id="lat" name="lat" value="">
        <input type="hidden" id="lon" name="lon" value="">
        <input type="hidden" id="address" name="address" value="">
        <input type="hidden" id="category" name="category" value="Restaurant">

        <!-- Store / Stall Name -->
        <div class="form-group">
          <label class="form-label" for="storeName">Food Stall / Store Name</label>
          <input type="text" id="storeName" name="name" class="form-input" placeholder="e.g. Grandma's Noodle Stall" required>
          
          <!-- Nearby candidate suggestion pills -->
          <div id="candidatePillsContainer" style="display: none;">
            <span style="font-size: 11px; color: var(--text-muted); display: block; margin-top: 6px;">Nearby detected eateries:</span>
            <div class="candidate-pills" id="candidatePills"></div>
          </div>
        </div>

        <!-- Star Rating -->
        <div class="form-group">
          <label class="form-label">Your Rating</label>
          <div class="star-rating-box" id="starContainer">
            <button type="button" class="star-btn" data-value="1">★</button>
            <button type="button" class="star-btn" data-value="2">★</button>
            <button type="button" class="star-btn" data-value="3">★</button>
            <button type="button" class="star-btn" data-value="4">★</button>
            <button type="button" class="star-btn" data-value="5">★</button>
          </div>
          <input type="hidden" id="ratingValue" name="rating" value="5" required>
          <div class="rating-label-desc" id="ratingDesc">⭐⭐⭐⭐⭐ Outstanding / Must Try!</div>
        </div>

        <!-- Food Description / Notes -->
        <div class="form-group">
          <label class="form-label" for="comment">Your Review & Food Notes</label>
          <textarea id="comment" name="comment" class="form-textarea" placeholder="What dish did you try? Signature recommendation, price, taste, or tips for next time..."></textarea>
        </div>

        <!-- Photo Upload -->
        <div class="form-group">
          <label class="form-label">Attach Food Photo</label>
          <div class="photo-uploader" onclick="document.getElementById('photoInput').click()">
            <span style="font-size: 28px;">📸</span>
            <p style="font-size: 13px; font-weight: 600; color: #475569; margin-top: 4px;">Tap to snap or upload food photo</p>
            <span style="font-size: 11px; color: #94a3b8;">Supports camera capture directly from iPhone</span>
            <input type="file" id="photoInput" name="photo" accept="image/*" style="display: none;" onchange="handlePhotoSelect(event)">
          </div>
          <div class="photo-preview-wrapper" id="photoPreviewWrapper">
            <img id="photoPreview" class="photo-preview" src="" alt="Food Preview">
            <button type="button" class="btn-remove-photo" onclick="removePhoto()">✕</button>
          </div>
        </div>

        <!-- Google Maps Link helper -->
        <div id="gmapsLinkBox" style="display: none; margin-bottom: 20px; font-size: 12px; color: #64748b;">
          📍 Location coordinates: <span id="coordsDisplay"></span> &bull; 
          <a id="gmapsExternalLink" href="#" target="_blank" style="color: #1a73e8; font-weight: 600;">Preview on Google Maps ↗</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit">💾 Save to My Foodie Map</button>
        <button type="button" class="btn-dismiss" onclick="dismissSession()">Skip / Not a Food Stall</button>
      </form>
    </div>
  </div>

  <script src="/js/review.js"></script>
</body>
</html>
