services:
  - type: web
    name: foodie-tracker
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NTFY_TOPIC
        generateValue: true
      - key: DWELL_THRESHOLD_SECONDS
        value: "300"
      - key: PROMPT_COOLDOWN_HOURS
        value: "12"
      - key: HOME_LAT
        sync: false
      - key: HOME_LON
        sync: false
      - key: WORK_LAT
        sync: false
      - key: WORK_LON
        sync: false
